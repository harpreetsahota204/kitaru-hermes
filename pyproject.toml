[project]
name = "kitaru-hermes"
version = "0.1.0"
description = "Hermes Agent plugin and session importer for Kitaru."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Harpreet Sahota", email = "harpreetsahota204@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai-agents", "hermes", "kitaru", "observability", "replay", "evals"]
dependencies = [
    "kitaru>=0.27.0",
]

[project.scripts]
kitaru-hermes = "kitaru_hermes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitaru_hermes"]
